<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<meta name="tvl-tilepage" content="1">
<title>Web-Launcher</title>
<style>
  :root {
    --bg: #0d1017;
    --tile: #1d2433;
    --tile-hi: #26324a;
    --text: #eef2f8;
    --muted: #8d98ab;
    --focus: #ffc400;
  }
  * { box-sizing: border-box; cursor: none !important; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 15% -10%, #1c2740 0%, var(--bg) 60%) fixed, var(--bg); color: var(--text);
    font-family: "SamsungOne", "Samsung Sharp Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  /* Ausgelegt auf 1920x1080, skaliert proportional mit der Fenstergroesse */
  #app { width: 1920px; height: 1080px; transform-origin: 0 0; padding: 70px 110px 60px; position: relative; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 46px; }
  h1 { font-size: 54px; font-weight: 700; margin: 0; letter-spacing: .5px; }
  h1 span { color: var(--focus); }
  #clock { font-size: 44px; font-weight: 300; color: var(--muted); font-variant-numeric: tabular-nums; }
  #viewport { height: 840px; overflow: hidden; position: relative; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 42px 38px; padding: 14px; transition: transform .25s ease; }
  .tile { background: var(--tile); border-radius: 26px; height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; border: 4px solid transparent; transition: transform .15s ease, background .15s ease, box-shadow .15s ease; position: relative; overflow: hidden; }
  .tile .icon { width: 112px; height: 112px; border-radius: 24px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
  .tile .icon img { width: 100%; height: 100%; object-fit: contain; }
  .tile .icon.letter { font-size: 62px; font-weight: 700; color: #fff; }
  .tile .name { font-size: 30px; font-weight: 600; max-width: 92%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.focus { background: var(--tile-hi); border-color: var(--focus); transform: scale(1.08);
    box-shadow: 0 0 0 4px rgba(0,0,0,.6), 0 0 38px 6px rgba(255,196,0,.45); z-index: 2; }
  #empty, #error { font-size: 36px; color: var(--muted); text-align: center; margin-top: 220px; line-height: 1.5; display: none; }
  footer { position: absolute; left: 110px; right: 110px; bottom: 34px; display: flex; gap: 46px; font-size: 26px; color: var(--muted); }
  footer b { display: inline-block; min-width: 38px; padding: 2px 10px; border-radius: 8px; background: #2a3243; color: var(--text); text-align: center; margin-right: 10px; font-weight: 600; }
  footer b.red { background: #c62828; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--muted);
    background: rgba(13,16,23,.85); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #loading.on { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Web-<span>Launcher</span></h1>
    <div id="clock"></div>
  </header>
  <div id="viewport">
    <div id="grid"></div>
    <div id="empty">Noch keine Webseiten eingetragen.<br>Admin-Seite: <b id="adminurl"></b></div>
    <div id="error">Liste konnte nicht geladen werden.<br>Neuer Versuch mit OK.</div>
  </div>
  <footer>
    <div><b>◀ ▶</b>Auswählen</div>
    <div><b>OK</b>Öffnen</div>
    <div><b>↩</b>Zurück: vorherige Seite</div>
    <div><b>↩ ↩ ↩</b>3× Zurück: zurück hierher</div>
  </footer>
  <div id="loading">Wird geöffnet …</div>
</div>
<script>
(function () {
  'use strict';
  var COLS = 6;
  var ROW_H = 292; // Kachelhoehe + Abstand
  var grid = document.getElementById('grid');
  var app = document.getElementById('app');
  var sites = [];
  var index = 0;
  // Im TizenBrew-Modul wird diese Seite lokal (127.0.0.1) ausgeliefert; die Liste kommt vom NAS.
  var NAS = window.__TVL_NAS || [location.origin];
  var BASE = NAS[0];
  var HOME = location.href.split('#')[0];

  document.getElementById('adminurl').textContent = (window.__TVL_ADMIN || BASE) + '/admin';

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    app.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  function clock() {
    var d = new Date();
    document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  clock();
  setInterval(clock, 15000);

  try {
    if (window.tizen && tizen.tvinputdevice) {
      ['ColorF0Red', 'MediaPlayPause'].forEach(function (k) { try { tizen.tvinputdevice.registerKey(k); } catch (e) {} });
    }
  } catch (e) {}

  function color(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + h + ',55%,42%)';
  }

  function letterIcon(ic, name) {
    ic.className = 'icon letter';
    ic.style.background = color(name || '?');
    ic.textContent = (name || '?').charAt(0).toUpperCase();
  }

  function render() {
    grid.innerHTML = '';
    document.getElementById('empty').style.display = sites.length ? 'none' : 'block';
    sites.forEach(function (s, i) {
      var t = document.createElement('div');
      t.className = 'tile';
      var ic = document.createElement('div');
      ic.className = 'icon';
      if (s.icon) {
        var img = document.createElement('img');
        img.src = s.icon.charAt(0) === '/' ? BASE + s.icon : s.icon;
        img.alt = '';
        img.onerror = function () { letterIcon(ic, s.name); };
        ic.appendChild(img);
      } else {
        letterIcon(ic, s.name);
      }
      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = s.name;
      t.appendChild(ic);
      t.appendChild(nm);
      t.addEventListener('click', function () { index = i; focus(); open(); });
      grid.appendChild(t);
    });
    if (index >= sites.length) index = Math.max(0, sites.length - 1);
    focus();
  }

  function focus() {
    var tiles = grid.children;
    for (var i = 0; i < tiles.length; i++) tiles[i].classList.toggle('focus', i === index);
    // 3 Zeilen sind sichtbar; bei mehr Kacheln mitscrollen
    var row = Math.floor(index / COLS);
    grid.style.transform = 'translateY(' + (-Math.max(0, row - 2) * ROW_H) + 'px)';
  }

  function open() {
    var s = sites[index];
    if (!s) return;
    // Konfiguration an die Zielseite mitgeben (window.name ueberlebt den Domainwechsel)
    try { window.name = 'tvl:' + JSON.stringify({ base: BASE, home: HOME, current: s.id, sites: sites }); } catch (e) {}
    try { sessionStorage.setItem('tvl_last', String(index)); } catch (e) {}
    document.getElementById('loading').classList.add('on');
    location.href = s.url;
  }

  // Liste vom NAS holen; mehrere Adressen nacheinander probieren
  function load() {
    var errors = [];
    var tryNext = function (i) {
      if (i >= NAS.length) { fail(errors); return; }
      var xhr = new XMLHttpRequest();
      try { xhr.open('GET', NAS[i] + '/api/sites?t=' + Date.now()); } catch (e) { errors.push(NAS[i] + ': ' + e.message); tryNext(i + 1); return; }
      xhr.timeout = 6000;
      xhr.onload = function () {
        try {
          sites = JSON.parse(xhr.responseText).sites || [];
          BASE = NAS[i];
          try { var lg = new XMLHttpRequest(); lg.open('POST', NAS[i] + '/api/log'); lg.send(JSON.stringify({ t: Date.now(), type: 'tile-load', url: location.href, data: { base: BASE, count: sites.length } })); } catch (e2) {}
          document.getElementById('error').style.display = 'none';
          try { var last = parseInt(sessionStorage.getItem('tvl_last'), 10); if (last >= 0) index = last; } catch (e) {}
          render();
        } catch (e) { errors.push(NAS[i] + ': HTTP ' + xhr.status); tryNext(i + 1); }
      };
      xhr.onerror = function () { errors.push(NAS[i] + ': Netzwerkfehler'); tryNext(i + 1); };
      xhr.ontimeout = function () { errors.push(NAS[i] + ': Zeitüberschreitung'); tryNext(i + 1); };
      xhr.send();
    };
    tryNext(0);
  }

  var retries = 0;
  function fail(errors) {
    // Der Hintergrunddienst auf dem TV startet evtl. noch – einige Male still erneut versuchen
    if (retries < 6) { retries++; setTimeout(load, 2500); return; }
    retries = 0;
    var el = document.getElementById('error');
    el.innerHTML = 'Liste konnte nicht vom NAS geladen werden.<br>Neuer Versuch mit OK.';
    if (errors && errors.length) {
      var d = document.createElement('div');
      d.style.cssText = 'font-size:24px;margin-top:24px;opacity:.8';
      d.textContent = errors.join(' · ');
      el.appendChild(d);
    }
    el.style.display = 'block';
  }

  function exitApp() {
    try { tizen.application.getCurrentApplication().exit(); } catch (e) {}
  }

  window.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    var n = sites.length;
    var handled = true;
    if (k === 37) { if (index % COLS > 0) index--; }
    else if (k === 39) { if (index < n - 1 && index % COLS < COLS - 1) index++; }
    else if (k === 38) { if (index - COLS >= 0) index -= COLS; }
    else if (k === 40) { if (index + COLS < n) index += COLS; else if (Math.floor(index / COLS) < Math.floor((n - 1) / COLS)) index = n - 1; }
    else if (k === 13) { if (document.getElementById('error').style.display === 'block') load(); else open(); }
    else if (k === 10009) { exitApp(); }
    else if (k === 403) { load(); }
    else handled = false;
    if (handled) { e.preventDefault(); e.stopPropagation(); focus(); }
  }, true);

  // Bei jedem Oeffnen / Zurueckkehren (auch aus dem Verlaufscache) Liste neu laden
  window.addEventListener('pageshow', function () { document.getElementById('loading').classList.remove('on'); load(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
